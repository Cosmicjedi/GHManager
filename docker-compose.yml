services:
  ghmanager:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghmanager:latest
    container_name: ghmanager
    # Published on 80 so the bare http://localhost works with no port to
    # remember, and on a second port because 80 is easy to lose to IIS, Skype
    # or another web server. Override either:
    #   GHMANAGER_PORT=3000 GHMANAGER_ALT_PORT=3100 docker compose up -d
    ports:
      - "${GHMANAGER_PORT:-80}:3000"
      - "${GHMANAGER_ALT_PORT:-3100}:3000"
    # Tokens added on the /tokens page live here, so they survive rebuilds
    # and never need to be put in a text file.
    volumes:
      - ghmanager-data:/app/data
    environment:
      # Optional legacy fallback. Prefer adding tokens on the /tokens page;
      # anything added there takes priority over this variable.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # How often the server re-scans GitHub in the background, in
      # milliseconds. Defaults to 5 minutes (300000); minimum 1 minute. The
      # background scan keeps the cache warm so page loads are always fast.
      GHMANAGER_REFRESH_INTERVAL_MS: ${GHMANAGER_REFRESH_INTERVAL_MS:-}
      # Uncomment for GitHub Enterprise Server.
      # GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-}
      # GITHUB_GRAPHQL_URL: ${GITHUB_GRAPHQL_URL:-}
    # Starts the container whenever the Docker daemon starts - i.e. every time
    # Docker Desktop launches - and restarts it if it crashes. `unless-stopped`
    # rather than `always` so an explicit `docker compose stop` stays stopped
    # across a daemon restart instead of coming back on its own.
    restart: unless-stopped
    # The image's own HEALTHCHECK calls /api/auth; compose surfaces it in `ps`.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/auth').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  ghmanager-data:
